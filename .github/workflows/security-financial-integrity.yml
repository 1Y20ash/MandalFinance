name: Security and Financial Integrity

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-financial-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mandalfinance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mandalfinance_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mandalfinance_ci
      RATELIMIT_STORAGE_URI: redis://localhost:6379/0
      PYTHONWARNINGS: error
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app api server.py

      - name: Check migration heads
        run: flask --app server.py db heads

      - name: Apply migrations on clean PostgreSQL
        env:
          FLASK_ENV: development
        run: flask --app server.py db upgrade

      - name: Verify Redis connectivity
        run: python -c "import redis; redis.Redis.from_url('${RATELIMIT_STORAGE_URI}').ping()"

      - name: Run regression and security tests
        run: python -m pytest -q