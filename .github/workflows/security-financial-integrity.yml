name: Security and Financial Integrity
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mandalfinance_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mandalfinance_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mandalfinance_ci
      RATELIMIT_STORAGE_URI: redis://localhost:6379/0
      REDIS_PROVIDER_NAME: ci-redis-service
      PYTHONWARNINGS: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Dependency security scan
        run: python -m pip install --upgrade setuptools && python -m pip install pip-audit==2.10.1 && pip-audit --local --strict
      - name: Compile Python sources
        run: python -m compileall -q app server.py scripts tests
      - name: Verify production configuration preflight
        env:
          SECRET_KEY: ci-production-test-secret-change-me-1234567890
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mandalfinance_ci
          SUPABASE_URL: https://ci-example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-production-service-role-test-key
          SUPABASE_STORAGE_PRIVATE: 'true'
          PAYMENT_GATEWAY_DRIVER: razorpay
          RAZORPAY_KEY_ID: rzp_test_ci_key
          RAZORPAY_KEY_SECRET: ci-razorpay-secret
          RAZORPAY_WEBHOOK_SECRET: ci-razorpay-webhook-secret
          RATELIMIT_STORAGE_URI: redis://localhost:6379/0
          REDIS_PROVIDER_NAME: ci-redis-service
        run: python scripts/verify_production_config.py
      - name: Run production configuration simulation
        env:
          FLASK_ENV: testing
        run: python -m pytest -q tests/test_phase32_production_configuration.py
      - name: Run deployment architecture tests
        run: python -m pytest -q tests/test_phase33_deployment_architecture.py
      - name: Run health check tests
        run: python -m pytest -q tests/test_phase34_health_checks.py
      - name: Run DPDP compliance matrix tests
        run: python -m pytest -q tests/test_phase35_dpdp_compliance_matrix.py
      - name: Check migration heads
        run: flask --app server.py db heads
      - name: Apply migrations on clean PostgreSQL
        env:
          FLASK_ENV: development
        run: flask --app server.py db upgrade
      - name: Run regression and security tests
        run: python -m pytest -q
