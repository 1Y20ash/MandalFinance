name: Security and Financial Integrity

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mandalfinance_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mandalfinance_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mandalfinance_ci
      RATELIMIT_STORAGE_URI: redis://localhost:6379/0
      PYTHONWARNINGS: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app migrations tests scripts server.py
      - name: Check migration heads
        run: flask --app app db heads
      - name: Apply migrations on clean PostgreSQL
        env:
          # TestingConfig intentionally uses an in-memory SQLite database for
          # the regression suite. Migration verification must exercise the
          # PostgreSQL service configured above instead.
          FLASK_ENV: development
        run: flask --app app db upgrade
      - name: Verify PostgreSQL schema contract
        env:
          FLASK_ENV: development
        run: python scripts/verify_postgres_schema.py
      - name: Verify production configuration contract
        env:
          FLASK_ENV: production
          SECRET_KEY: ci-production-secret-0123456789abcdef0123456789abcdef
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mandalfinance_ci
          SUPABASE_URL: https://ci-example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-secret
          SUPABASE_STORAGE_BUCKET: mandal-financial-documents
          SUPABASE_STORAGE_PRIVATE: 'true'
          ONLINE_DONATION_ACCOUNT_ID: '1'
          ONLINE_DONATION_ACTOR_ID: '1'
          PAYMENT_GATEWAY_DRIVER: razorpay
          RAZORPAY_KEY_ID: rzp_test_ci
          RAZORPAY_KEY_SECRET: ci-razorpay-secret
          RAZORPAY_WEBHOOK_SECRET: ci-webhook-secret
          MAX_CONTENT_LENGTH: '16777216'
          MAX_DOCUMENT_SIZE: '10485760'
        run: python scripts/verify_production_config.py
      - name: Run regression and security tests
        run: python -m pytest -q
