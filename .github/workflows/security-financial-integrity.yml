name: Security and Financial Integrity

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-secret
      PYTHONWARNINGS: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app api app.py
      - name: Check migration heads
        run: flask --app app.py db heads
      - name: Apply migrations on clean SQLite
        run: flask --app app.py db upgrade
      - name: Run regression and security tests
        run: python -m pytest -q
