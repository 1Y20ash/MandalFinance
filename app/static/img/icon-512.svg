<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="12 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  
  <!-- Central Emblem: Om / Ganesha Symbol -->
  <g transform="translate(256, 256) scale(1.4)" text-anchor="middle" dominant-baseline="central">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="140" fill="url(#goldGrad)">🕉</text>
  </g>
  
  <!-- Subtle Mandal Ring -->
  <text x="256" y="420" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="28" fill="#fef08a" text-anchor="middle" letter-spacing="4">ASHTAVINAYAK</text>
</svg>
