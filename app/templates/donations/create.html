{% extends "base.html" %}
{% block title %}Record Donation - Ashtavinayak Mandal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white fw-bold">
                <i class="fa-solid fa-plus-circle me-2"></i>Record Offline Donation
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Target Event</label>
                            <select name="event_id" class="form-select" required>
                                {% for ev in events %}
                                    <option value="{{ ev.id }}">{{ ev.title }} ({{ ev.year }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Receiving Account</label>
                            <select name="account_id" class="form-select" required>
                                {% for acc in accounts %}
                                    <option value="{{ acc.id }}">{{ acc.name }} ({{ acc.account_type | upper }})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Donor Name</label>
                            <input type="text" name="donor_name" class="form-control" placeholder="e.g. Ramesh Kumar" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Donation Amount (₹)</label>
                            <input type="number" step="0.01" min="1" name="amount" class="form-control" placeholder="e.g. 5000.00" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Payment Mode</label>
                            <select name="payment_mode" class="form-select" required>
                                <option value="CASH">CASH</option>
                                <option value="UPI">UPI</option>
                                <option value="BANK_TRANSFER">BANK TRANSFER</option>
                                <option value="CHEQUE">CHEQUE</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Donor Phone</label>
                            <input type="text" name="donor_phone" class="form-control" placeholder="Optional">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">PAN Number</label>
                            <input type="text" name="pan_number" class="form-control" placeholder="Optional (for 80G)">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Transaction Ref / UTR / Cheque No.</label>
                        <input type="text" name="transaction_ref" class="form-control" placeholder="Optional for cash, required for UPI/Bank">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Purpose / Notes</label>
                        <textarea name="purpose" class="form-control" rows="2" placeholder="e.g., General Utsav Donation / Prasad Sponsorship"></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('donations.list_donations') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success px-4"><i class="fa-solid fa-check me-1"></i>Save Donation & Issue Receipt</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
