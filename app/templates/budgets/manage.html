{% extends "base.html" %}
{% block title %}Configure Budget - Ashtavinayak Mandal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white fw-bold">
                <i class="fa-solid fa-edit me-2"></i>Configure Budget Targets & Limits for {{ active_event.title }}
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Overall Income Target (₹)</label>
                            <input type="number" step="0.01" min="0" name="total_income_target" class="form-control" value="{{ budget.total_income_target if budget else '500000.00' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Overall Expense Limit (₹)</label>
                            <input type="number" step="0.01" min="0" name="total_expense_limit" class="form-control" value="{{ budget.total_expense_limit if budget else '450000.00' }}" required>
                        </div>
                    </div>

                    <h6 class="fw-bold border-bottom pb-2 mb-3">Category Level Allocations</h6>
                    {% for cat in categories %}
                    <div class="row align-items-center mb-3">
                        <div class="col-md-6">
                            <label class="form-label mb-0 fw-bold">{{ cat.name }}</label>
                        </div>
                        <div class="col-md-6">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text">₹</span>
                                <input type="number" step="0.01" min="0" name="cat_limit_{{ cat.id }}" class="form-control" value="{{ bcat_map.get(cat.id, '0.00') }}">
                            </div>
                        </div>
                    </div>
                    {% endfor %}

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('budgets.index') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-warning px-4"><i class="fa-solid fa-save me-1"></i>Save Budget Allocations</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
