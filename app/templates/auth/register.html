{% extends "base.html" %}
{% block title %}Register - Ashtavinayak Mandal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 my-3">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <span class="fs-1">🕉</span>
                    <h4 class="fw-bold mt-2">Mandal Member Registration</h4>
                    <p class="text-muted small">Join Shree Ashtavinayak Ganesh Utsav Mandal</p>
                </div>
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="mb-3">
                        <label for="full_name" class="form-label fw-bold">Full Name</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" placeholder="e.g. Ramesh Patil" required autofocus>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="username" class="form-label fw-bold">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="e.g. ramesh_p" required>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-bold">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="10-digit mobile">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-bold">Password</label>
                            <input type="password" class="form-control" id="password" name="password" minlength="6" required>
                        </div>
                        <div class="col-md-6">
                            <label for="confirm_password" class="form-label fw-bold">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 py-2 fw-bold"><i class="fa-solid fa-user-plus me-2"></i>Create Account</button>

                    <div class="text-center mt-3 border-top pt-3">
                        <span class="text-muted small">Already have an account?</span>
                        <a href="{{ url_for('auth.login') }}" class="fw-bold text-decoration-none ms-1">Log In Here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
