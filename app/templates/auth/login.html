{% extends "base.html" %}
{% block title %}Login - Ashtavinayak Mandal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-om text-danger fa-3x mb-2"></i>
                    <h4 class="fw-bold">Mandal Login</h4>
                    <p class="text-muted small">Financial Management & Accountability System</p>
                </div>
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username or Email</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">Remember Me</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2"><i class="fa-solid fa-right-to-bracket me-2"></i>Log In</button>

                    <div class="text-center mt-3 border-top pt-3">
                        <span class="text-muted small">New to Ashtavinayak Mandal?</span>
                        <a href="{{ url_for('auth.register') }}" class="fw-bold text-decoration-none ms-1">Register Account</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
