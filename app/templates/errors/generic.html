{% extends 'base.html' %}
{% block title %}Request Error{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 720px;">
  <div class="card p-5 text-center">
    <div class="display-4 fw-bold">{{ status_code }}</div>
    <h1 class="h3 mt-3">{{ message }}</h1>
    <p class="text-muted">No internal details are shown here. If the problem persists, contact the system administrator.</p>
    <a class="btn btn-primary" href="{{ url_for('public.transparency') }}">Return to home</a>
  </div>
</div>
{% endblock %}
