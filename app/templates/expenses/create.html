{% extends "base.html" %}
{% block title %}Submit Expense - Ashtavinayak Mandal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white fw-bold">
                <i class="fa-solid fa-plus-circle me-2"></i>Submit Expense for Approval
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Target Event</label>
                            <select name="event_id" class="form-select" required>
                                {% for ev in events %}
                                    <option value="{{ ev.id }}">{{ ev.title }} ({{ ev.year }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Expense Category</label>
                            <select name="category_id" class="form-select" required>
                                {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                            <label class="form-label fw-bold">Expense Title</label>
                            <input type="text" name="title" class="form-control" placeholder="e.g. Stage Sound System Rental" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Amount (₹)</label>
                            <input type="number" step="0.01" min="1" name="amount" class="form-control" placeholder="e.g. 15000.00" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Vendor (Optional)</label>
                            <select name="vendor_id" class="form-select">
                                <option value="">-- No Specific Vendor --</option>
                                {% for v in vendors %}
                                    <option value="{{ v.id }}">{{ v.name }} ({{ v.category }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Expense Date</label>
                            <input type="date" name="expense_date" class="form-control" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Bill / Invoice Number</label>
                            <input type="text" name="bill_number" class="form-control" placeholder="Optional bill reference">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Bill Date</label>
                            <input type="date" name="bill_date" class="form-control">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Description & Operational Justification</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Provide detailed rationale for this expense..." required></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('expenses.list_expenses') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4"><i class="fa-solid fa-paper-plane me-1"></i>Submit for Approval</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
