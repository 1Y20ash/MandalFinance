{% extends "base.html" %}
{% block title %}Online Donation - Shree Ashtavinayak Ganesh Utsav Mandal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 mt-2">
            <div class="card-header bg-dark text-white text-center py-3">
                <i class="fa-solid fa-om text-danger fa-2x mb-1"></i>
                <h4 class="fw-bold mb-0">Online Donation Portal</h4>
                <p class="small text-muted mb-0">Ganesh Utsav {{ active_event.year if active_event else '2026' }}</p>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Select Preset Amount or Enter Custom (₹)</label>
                        <div class="btn-group w-100 mb-2" role="group">
                            <button type="button" class="btn btn-outline-success" onclick="setAmt(501)">₹501</button>
                            <button type="button" class="btn btn-outline-success" onclick="setAmt(1001)">₹1,001</button>
                            <button type="button" class="btn btn-outline-success" onclick="setAmt(2501)">₹2,501</button>
                            <button type="button" class="btn btn-outline-success" onclick="setAmt(5001)">₹5,001</button>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text fw-bold">₹</span>
                            <input type="number" step="1" min="1" id="amount" name="amount" class="form-control form-control-lg fw-bold" placeholder="Amount in INR" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Donor Full Name</label>
                        <input type="text" name="donor_name" class="form-control" placeholder="Your Name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number (For Instant Receipt)</label>
                        <input type="tel" name="donor_phone" class="form-control" placeholder="10-digit Mobile Number">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address (Optional)</label>
                        <input type="email" name="donor_email" class="form-control" placeholder="name@example.com">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Donation Purpose</label>
                        <select name="purpose" class="form-select">
                            <option value="General Utsav Donation">General Utsav Donation</option>
                            <option value="Prasad & Mahaprasad">Prasad & Mahaprasad</option>
                            <option value="Cultural Program">Cultural Program</option>
                            <option value="Mandal Decoration">Mandal Decoration</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 py-3 fw-bold"><i class="fa-solid fa-lock me-2"></i>Proceed to Secure Payment</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function setAmt(val) {
    document.getElementById('amount').value = val;
}
</script>
{% endblock %}
